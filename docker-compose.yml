name: arendo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arendo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db:/sql:ro
      - ./db/docker/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "arendo"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://arendo_app:${APP_DB_PASSWORD}@db:5432/arendo
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      TRUST_PROXY: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    # Учётные записи из переменных окружения, затем сам сервер.
    command: sh -c "node dist/database/accounts.js && exec node dist/main.js"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Ежедневная копия БД, хранится 14 дней (требование ТЗ о надёжности).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backups:/backups
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/arendo-$$(date +%F).dump
          pg_dump -h db -U postgres -Fc arendo -f "$$file.tmp" && mv "$$file.tmp" "$$file"
          find /backups -name 'arendo-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  uploads:
  backups:
