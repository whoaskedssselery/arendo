name: Backend
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: arendo_api_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/arendo_api_test
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/arendo_api_test
      JWT_ACCESS_SECRET: ci-only-secret-not-used-anywhere-else-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Тесты БД
        working-directory: db/tests
        run: npm ci && npm test
      - name: Сборка и модульные тесты
        working-directory: backend
        run: npm ci && npm run build && npm test && npm audit --omit=dev --audit-level=high
      - name: Интеграционные тесты API
        working-directory: backend
        run: |
          npm run db:init
          node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/api/v1/health && break; sleep 1; done
          npm run test:api || { cat server.log; exit 1; }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Весь стек поднимается и отвечает
        run: |
          printf 'POSTGRES_PASSWORD=ci-pg-password\nAPP_DB_PASSWORD=ci-app-password\nJWT_ACCESS_SECRET=ci-only-secret-not-used-anywhere-else-000000\n' > .env
          docker compose up -d --build --wait || { docker compose logs; exit 1; }
          curl -sf http://127.0.0.1:8080/api/v1/rooms
          curl -sf http://127.0.0.1:8080/ > /dev/null
          # скрипт тестовых данных должен проходить дважды подряд
          for i in 1 2; do docker compose exec -T db psql -U postgres -d arendo -v ON_ERROR_STOP=1 -f /sql/05_demo_data.sql; done
